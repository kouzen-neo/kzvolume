name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Extract version
        id: version
        run: |
          INFO=$(./gradlew -q app:printAppInfo)
          VERSION=$(echo "$INFO" | jq -r '.version')
          VERSION_MAJOR=$(echo "$INFO" | jq -r '.versionMajor')
          VERSION_CODE=$(echo "$INFO" | jq -r '.versionCode')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_major=$VERSION_MAJOR" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: tag_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare keystore
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
          else
            keytool -genkeypair -v -keystore app/release.jks -alias kzvolume -keyalg RSA -keysize 2048 -validity 10000 -storepass kzvolume -keypass kzvolume -dname "CN=kzvolume, O=kzvolume, C=ID"
          fi

      - name: Build release APKs (splits)
        if: steps.tag_check.outputs.exists == 'false'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'kzvolume' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'kzvolume' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'kzvolume' }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          rm -f app/release.jks

      - name: Prepare release artifacts
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/
          ls -la release-artifacts/

      - name: Extract changelog
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            NOTES=$(sed -n '/^## \[v/,/^## \[/p' CHANGELOG.md | sed '$d')
          fi
          if [ -z "$NOTES" ]; then
            NOTES="kzvolume release ${{ steps.version.outputs.tag }}"
          fi

          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "kzvolume ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ${{ steps.changelog.outputs.content }}
          files: |
            release-artifacts/kzvolume-arm64-v8a.apk
            release-artifacts/kzvolume-armeabi-v7a.apk
            release-artifacts/kzvolume-universal.apk
